# 月屿 · 星月照片墙 Nginx 配置
# 将 photos.example.com 替换为你的域名，证书路径替换为 Certbot 生成的路径。
# 安装到 /etc/nginx/sites-available/moon-isle 并软链到 sites-enabled。

limit_req_zone $binary_remote_addr zone=moon_api:10m rate=20r/s;

server {
    listen 80;
    server_name photos.example.com;

    # Certbot HTTP-01 校验目录
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name photos.example.com;

    root /opt/moon-isle/web/dist;
    index index.html;
    server_tokens off;
    limit_req_status 429;

    ssl_certificate     /etc/letsencrypt/live/photos.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/photos.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # 8 MB 分片 + 头部开销；若调大 CHUNK_SIZE_MB，也要同步调大这里
    client_max_body_size 20m;
    client_body_timeout 120s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: blob:; media-src 'self' blob:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; font-src 'self' data:; worker-src 'self' blob:" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
    # 如已安装 ngx_brotli 模块，可开启：
    # brotli on;
    # brotli_comp_level 5;
    # brotli_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # 大文件分片：关闭请求缓冲，让 Node 直接接收
    location ^~ /api/media/upload/ {
        limit_req zone=moon_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/ {
        limit_req zone=moon_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 内部鉴权子请求：校验登录，并校验文件属于月亮外还是月亮内部。
    location = /_upload_auth {
        internal;
        proxy_pass http://127.0.0.1:3000/api/auth/verify-upload;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 上传文件由 Nginx 直接提供，但先经过登录鉴权
    location /uploads/ {
        auth_request /_upload_auth;
        alias /opt/moon-isle/data/uploads/;
        autoindex off;
        # 月亮内部文件只对管理员可见；统一不落浏览器缓存，避免退出后残留。
        add_header Cache-Control "private, no-store" always;
        expires off;
    }

    # 带 hash 的构建资源
    location /assets/ {
        try_files $uri =404;
        expires 365d;
    }

    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
